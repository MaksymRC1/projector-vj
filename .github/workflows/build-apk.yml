name: Build Android Projector APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy WebGL & DSP Assets into Android App
        run: |
          cp index.html studio.html manifest.json style.css dsp-engine.js shader-visualizer.js sync-manager.js app.js studio.js android/app/src/main/assets/
          if [ -f cert/keystore.p12 ]; then cp cert/keystore.p12 android/app/src/main/assets/; fi

      - name: Build Android Projector APK
        working-directory: ./android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk aura-vj-projector.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-vj-projector-apk
          path: aura-vj-projector.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "AURA VJ — Android Projector & Smart TV APK v2.7.0"
          body: "Оновлений Android APK для проекторів та Smart TV із підтримкою прямої Wi-Fi LAN синхронізації (<1ms), динамічного Live-завантаження оновлень без перевстановлення, та вбудованим механізмом оновлення."
          files: aura-vj-projector.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
